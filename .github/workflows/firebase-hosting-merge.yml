name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main
      - dev

jobs:
  verify_backend:
    name: Verify Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Generate Prisma Client & Build Server
        run: npm run build
        working-directory: server

  build_and_deploy:
    name: Build Client & Deploy to Firebase
    needs: verify_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Clean previous dist
        run: rm -rf dist
        working-directory: client

      - name: Build Client Application
        run: npm run build
        working-directory: client

      - name: Verify dist output
        run: ls -la dist/
        working-directory: client

      - name: Deploy Live Channel to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GESTORCR }}'
          channelId: live
          projectId: gestorcr-app
          entryPoint: '.'
