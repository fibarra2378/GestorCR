name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  verify_backend:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    name: Verify Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Generate Prisma Client & Build Server
        run: npm run build
        working-directory: server

  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    needs: verify_backend
    name: Build Client & Deploy Preview to Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm install
        working-directory: client

      - name: Clean previous dist
        run: rm -rf dist
        working-directory: client

      - name: Build Client Application
        run: npm run build
        working-directory: client

      - name: Verify dist output
        run: ls -la dist/
        working-directory: client

      - name: Deploy Preview Channel to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GESTORCR }}'
          projectId: gestorcr-app
